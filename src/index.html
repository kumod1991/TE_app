<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <meta
      name="description"
      content="TradeEdge is an Indian stock market analytics workspace for watchlists, screeners, FII/DII flows, market breadth, portfolio tracking, trade journaling, and stock research."
    />

    <title>TradeEdge | Indian Stock Market Analytics, Screener and Trade Journal</title>
    <link rel="canonical" href="https://tradeedge.in/" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@600;700;800&display=swap"
      media="screen and (min-width: 769px)"
    />

    <meta property="og:site_name" content="TradeEdge" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TradeEdge | Indian Stock Market Analytics" />
    <meta
      property="og:description"
      content="Screen Indian stocks, track watchlists, read FII/DII flows, follow market breadth, and journal portfolio performance in one workspace."
    />
    <meta property="og:url" content="https://tradeedge.in/" />
    <meta property="og:image" content="https://tradeedge.in/og-image.svg" />
    <meta property="og:image:alt" content="TradeEdge Indian stock market analytics dashboard preview" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TradeEdge | Indian Stock Market Analytics" />
    <meta
      name="twitter:description"
      content="Indian stock screener, watchlist, FII/DII tracker, market breadth, portfolio tracker, and trade journal."
    />
    <meta name="twitter:image" content="https://tradeedge.in/og-image.svg" />

    <script type="application/ld+json" data-seo="tradeedge">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "TradeEdge",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web",
        "url": "https://tradeedge.in/",
        "description": "TradeEdge is an Indian stock market analytics workspace for watchlists, screeners, FII/DII flows, market breadth, portfolio tracking, trade journaling, and stock research.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "INR"
        }
      }
    </script>
  </head>
  <body>
    <noscript>
      TradeEdge needs JavaScript to run its market analytics dashboard, stock screener, watchlist, portfolio tracker, and trade journal.
    </noscript>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
    <script>
      window.addEventListener("load", () => {
        const loadAds = () => {
          if (document.getElementById("tradeedge-adsense")) return;
          const s = document.createElement("script");
          s.id = "tradeedge-adsense";
          s.async = true;
          s.crossOrigin = "anonymous";
          s.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4063180365030716";
          document.head.appendChild(s);
        };
        const loadAdsWhenIdle = () => {
          if ("requestIdleCallback" in window) requestIdleCallback(loadAds, { timeout: 3000 });
          else setTimeout(loadAds, 1);
        };
        ["pointerdown", "keydown", "touchstart", "scroll"].forEach((eventName) => {
          window.addEventListener(eventName, loadAdsWhenIdle, { once: true, passive: true });
        });
        setTimeout(loadAdsWhenIdle, 45000);
      });
    </script>
  </body>
</html>
