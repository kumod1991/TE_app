<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111f" />
    <meta name="description" content="TradeEdge is an Indian stock market analytics workspace for watchlists, screeners, FII/DII flows, market breadth, portfolio tracking, trade journaling, and stock research." />
    <link rel="icon" href="/tradeedge-favicon.svg?v=20260526" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Manrope:wght@500;600;700;800&display=swap">
    <link rel="shortcut icon" href="/tradeedge-favicon.svg?v=20260526" type="image/svg+xml" />
    <link rel="manifest" href="/site.webmanifest" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@600;700;800&display=swap"
      media="screen and (min-width: 769px)"
    />
    <title>TradeEdge | Indian Stock Market Dashboard</title>
    
  </head>
  <body>
    <nav aria-label="Legal links" style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;">
      <a href="/legal/privacy">Privacy Policy</a>
      <a href="/legal/terms">Terms</a>
      <a href="/legal/disclaimer">Disclaimer</a>
      <a href="/legal/contact">Contact Us</a>
    </nav>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      window.addEventListener("load", () => {
        const loadAds = () => {
          if (document.getElementById("tradeedge-adsense")) return;
          const s = document.createElement("script");
          s.id = "tradeedge-adsense";
          s.async = true;
          s.crossOrigin = "anonymous";
          s.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4063180365030716";
          document.head.appendChild(s);
        };
        const loadAdsWhenIdle = () => {
          if ("requestIdleCallback" in window) requestIdleCallback(loadAds, { timeout: 3000 });
          else setTimeout(loadAds, 1);
        };
        ["pointerdown", "keydown", "touchstart", "scroll"].forEach((eventName) => {
          window.addEventListener(eventName, loadAdsWhenIdle, { once: true, passive: true });
        });
        setTimeout(loadAdsWhenIdle, 45000);
      });
    </script>
  </body>
</html>
